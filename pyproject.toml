[project]
name = "pfizer-rag-ai-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leo Newton", email = "leo.newton@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "faiss-cpu>=1.15.1",
    "google-generativeai>=0.8.6",
    "gradio>=6.30.0",
    "gradio-pdf>=0.0.24",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "llama-cpp-python>=0.3.36",
    "llama-index>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-gemini>=0.6.2",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-faiss>=0.7.0",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "pypdf2>=3.0.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
pfizer-rag-ai-pipeline = "pfizer_rag_ai_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
