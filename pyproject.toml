[project]
name = "pfizer-rag-ai-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leo Newton", email = "leo.newton@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gradio>=6.30.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "llama-cpp-python>=0.3.36",
    "llama-index>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "numpy>=2.5.4",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
pfizer-rag-ai-pipeline = "pfizer_rag_ai_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
